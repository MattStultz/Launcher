; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:elecrow-esp32p4-10in]
; This is boards/elecrow-esp32p4-7in verbatim (pins, timing, touch, rotation
; all unchanged) with only the identifying strings below and the two
; necessary exceptions changed. Confirmed on real 10.1in hardware
; (2026-08-19): correct display orientation and fully working touch, using
; the 7in board's values completely unmodified. An earlier attempt at this
; board with "10.1in-specific" display timing and a custom touch reset
; sequence introduced real bugs (rotation and touch-mapping regressions)
; that don't exist with the 7in board's original values -- don't
; reintroduce those changes without hardware evidence they're needed.
;
; Exception 1: this unit's flash chip doesn't support SPI suspend/resume,
; which the default arduino-esp32-libs build assumes and crash-loops
; without ("assert failed: __esp_system_init_fn_init_flash"). Same root
; cause as https://github.com/bmorcelli/Launcher/issues/324. `board` is
; downgraded from esp32p4_es (this chip's actual pre-production silicon
; revision, per esptool) to esp32p4 (production) because the only known
; suspend-disabled library build predates esp32p4_es support. Works, but
; is running against a mismatched chip-revision profile -- a real open
; risk, not a clean fix. Ask upstream for a build with both fixes if this
; becomes a problem.
board = esp32p4
platform_packages = framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/gen_p4_esp32-arduino-libs-20260525-121914.tar.xz
board_build.partitions = support_files/custom_16Mb_p4.csv
monitor_dtr = 0
monitor_rts = 0
build_src_filter =${env.build_src_filter} +<../boards/elecrow-esp32p4-10in>
extra_scripts =
	${env.extra_scripts}
	pre:support_files/patch_hosted_sdio_freq.py
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0

	-DENABLE_ESP_AT_INTERFACE=1

	; Exception 2: identifying strings only.
	-DDEVICE_NAME='"Elecrow CrowPanel Advanced 10.1in P4"'
	-DOTA_TAG='"elecrow-esp32p4-10in"'

	-DROTATION=1
	-DHAS_TOUCH=1
	-DDIMMER_SETUP=60
	-DFP=3
	-DFM=5
	-DFG=7

	# WiFi/BT comes from an onboard ESP32-C6 module bridged over SDIO.
	# CLK=GPIO18, CMD=GPIO19, C6_EN(reset)=GPIO32 match the schematic.
	# D0-D3 order: CONFIRMED via Elecrow's own factory firmware (flashed to
	# this exact 10.1in unit, connects to the C6 cleanly -- "Identified
	# slave [esp32c6]", full wifi_init) to be the ORIGINAL schematic order
	# below, at 4-bit bus width, 40MHz. This contradicts the 7in board's own
	# comment claiming this order "does not actually work" and needs
	# reversing -- that claim was seemingly specific to that unit/attempt
	# (possibly conflated with a different bug), not a general rule. If
	# WiFi doesn't come up on a given unit, try the reverse order
	# (14,15,16,17) at runtime before rebuilding: `sdio set 18 19 14 15 16
	# 17 32` (see the "sdio" serial console command).
	-D SDIO2_CLK=GPIO_NUM_18
	-D SDIO2_CMD=GPIO_NUM_19
	-D SDIO2_D0=GPIO_NUM_17
	-D SDIO2_D1=GPIO_NUM_16
	-D SDIO2_D2=GPIO_NUM_15
	-D SDIO2_D3=GPIO_NUM_14
	-D SDIO2_RST=GPIO_NUM_32
	# Frequency: factory firmware runs the SDIO link at 40MHz successfully
	# on this exact unit, so no override -- let it use the library default
	# (also 40MHz) rather than the 7in board's halved-to-20MHz workaround,
	# which was for a CRC issue on a different unit that may have been the
	# D0-D3 order above, not a frequency problem. patch_hosted_sdio_freq.py
	# (in extra_scripts) is a no-op unless LAUNCHER_HOSTED_SDIO_FREQ_KHZ is
	# defined, so it's left in place harmlessly.

	# Bring-up timeout: raised from the 8000ms default (see the comment on
	# kHostedInitTimeoutMs in src/idf/idf_wifi.cpp) because a real
	# connection on this unit takes ~14.2s, longer than the default allows.
	# Confirmed working end-to-end (auto-connect + SSID scan) at this value.
	-D HOSTED_INIT_TIMEOUT_MS=20000

	# Display: EK79007 MIPI-DSI panel, 1024x600, 2 data lanes, driven over
	# Arduino_ESP32DSIPanel. Pins/timings copied verbatim from the 7in board
	# (which, per Elecrow's own docs, shares identical schematics/wiring with
	# the 10.1in board -- and is now confirmed hardware-correct on the 10.1in
	# panel too, unlike the previously-attempted 10.1in-specific timing).
	-DTFT_DATABUS_N=4   # Arduino_ESP32DSIPanel
	-DTFT_DISPLAY_DRIVER_N=50 # Arduino_DSI_Display
	-DTFT_WIDTH=1024
	-DTFT_HEIGHT=600
	-DTFT_RST=41
	-DTFT_HSYNC_PULSE_WIDTH=10
	-DTFT_HSYNC_BACK_PORCH=160
	-DTFT_HSYNC_FRONT_PORCH=160
	-DTFT_VSYNC_PULSE_WIDTH=1
	-DTFT_VSYNC_BACK_PORCH=23
	-DTFT_VSYNC_FRONT_PORCH=12
	-DTFT_PREF_SPEED=52000000
	-DTFT_DSI_LANE_BIT_RATE=1000
	-DTFT_DSI_INIT=ek79007_init_operations
	-DTFT_BL=31
	-DTFT_BL_POWER=29

	# Touch: GT911, capacitive, I2C. Wired directly to the P4 (no IO expander
	# on this model, unlike the ESP32-S3 CrowPanel boards).
	-DTOUCH_GT911_I2C=1
	-DGT911_I2C_CONFIG_SDA_IO_NUM=45
	-DGT911_I2C_CONFIG_SCL_IO_NUM=46
	-DGT911_TOUCH_CONFIG_RST_GPIO_NUM=40
	-DGT911_TOUCH_CONFIG_INT_GPIO_NUM=42

	-DUSE_SD_MMC=1
	-D SDM=SD_MMC
	-DPIN_SD_CLK=43
	-DPIN_SD_CMD=44
	-DPIN_SD_D0=39
	-D BOARD_SDMMC_SLOT=0
	-D BOARD_HAS_SDMMC=1
	-D BOARD_SDMMC_POWER_CHANNEL=4

	# The board's second USB-C port (the one NOT wired through the CH340 used
	# for flashing/console) goes straight to the ESP32-P4's dedicated DM/DP
	# pins per the schematic -- the same "own UTMI PHY, fixed pads" high-speed
	# OTG controller lilygo-t-display-p4's "High Speed USB" port uses (see
	# massStorage.cpp's rhport 0 vs 1 comment). UNVERIFIED: this port was not
	# connected to a host to test against: if USB mass storage doesn't
	# enumerate, this is the first thing to question.
	-D USB_MSC_HIGH_SPEED=1

lib_deps =
	${env.lib_deps}
	https://github.com/mmMicky/TouchLib
	https://github.com/bmorcelli/Arduino_GFX#ek79007_display

lib_ignore =
	SensorLib
	XPowersLib
