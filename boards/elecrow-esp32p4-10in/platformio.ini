; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:elecrow-esp32p4-10in]
board = esp32p4_es
board_build.partitions = support_files/custom_16Mb_p4.csv
monitor_dtr = 0
monitor_rts = 0
build_src_filter =${env.build_src_filter} +<../boards/elecrow-esp32p4-10in>
extra_scripts =
	${env.extra_scripts}
	pre:support_files/patch_hosted_sdio_freq.py
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0

	-DENABLE_ESP_AT_INTERFACE=1

	-DDEVICE_NAME='"Elecrow CrowPanel Advanced 10.1in P4"'
	-DOTA_TAG='"elecrow-esp32p4-10in"'

	-DROTATION=1
	-DHAS_TOUCH=1
	-DDIMMER_SETUP=60
	-DFP=3
	-DFM=5
	-DFG=7

	# WiFi/BT bridge, SD pins, touch, backlight, and USB-MSC config below are
	# copied unchanged from boards/elecrow-esp32p4-7in. Elecrow's own docs
	# state the 7in/9in/10.1in boards share identical schematics/wiring --
	# only the physical panel and its MIPI-DSI timing differ (see the
	# TFT_H*/TFT_V* block below). NOT independently verified against real
	# 10.1in hardware -- the 7in board's own history (Elecrow's *documented*
	# SDIO D0-D3 order was wrong and had to be found by testing) is reason
	# enough to re-check all of this on a real 10.1in unit rather than trust
	# it blindly. If the WiFi bridge doesn't come up, try the runtime "sdio"
	# console command with alternate pin orders before assuming the wiring
	# itself differs from the 7in board.
	-D SDIO2_CLK=GPIO_NUM_18
	-D SDIO2_CMD=GPIO_NUM_19
	-D SDIO2_D0=GPIO_NUM_14
	-D SDIO2_D1=GPIO_NUM_15
	-D SDIO2_D2=GPIO_NUM_16
	-D SDIO2_D3=GPIO_NUM_17
	-D SDIO2_RST=GPIO_NUM_32
	-D LAUNCHER_HOSTED_SDIO_FREQ_KHZ=20000

	# Display: EK79007 MIPI-DSI panel, 1024x600, 2 data lanes, driven over
	# Arduino_ESP32DSIPanel. Pins match the 7in board (same P4 wiring per
	# Elecrow). Timings below are NOT copied from the 7in board -- they come
	# straight from Elecrow's own 10.1in-specific Arduino example
	# (esp_panel_board_custom_conf.h / board_config.h for this exact SKU,
	# DHE04310D; see common/constants.h in the parent CrowPannelFirmwares
	# repo for the source). They differ meaningfully from the 7in board's
	# hardware-confirmed values (HSYNC_PULSE_WIDTH 70 vs 10, VSYNC_PULSE_WIDTH
	# 10 vs 1, VSYNC_FRONT_PORCH 21 vs 12) -- plausible since different
	# physical LCD glass can need different timing at the same resolution,
	# but UNTESTED on real 10.1in hardware. If the screen doesn't sync
	# (blank, torn, or rolling image), try the 7in board's timing values as
	# a fallback before assuming something else is wrong.
	-DTFT_DATABUS_N=4   # Arduino_ESP32DSIPanel
	-DTFT_DISPLAY_DRIVER_N=50 # Arduino_DSI_Display
	-DTFT_WIDTH=1024
	-DTFT_HEIGHT=600
	-DTFT_RST=41
	-DTFT_HSYNC_PULSE_WIDTH=70
	-DTFT_HSYNC_BACK_PORCH=160
	-DTFT_HSYNC_FRONT_PORCH=160
	-DTFT_VSYNC_PULSE_WIDTH=10
	-DTFT_VSYNC_BACK_PORCH=23
	-DTFT_VSYNC_FRONT_PORCH=21
	-DTFT_PREF_SPEED=51000000
	-DTFT_DSI_LANE_BIT_RATE=1000
	-DTFT_DSI_INIT=ek79007_init_operations
	-DTFT_BL=31
	-DTFT_BL_POWER=29

	# Touch: GT911, capacitive, I2C. Wired directly to the P4 (no IO expander
	# on this model, unlike the ESP32-S3 CrowPanel boards).
	-DTOUCH_GT911_I2C=1
	-DGT911_I2C_CONFIG_SDA_IO_NUM=45
	-DGT911_I2C_CONFIG_SCL_IO_NUM=46
	-DGT911_TOUCH_CONFIG_RST_GPIO_NUM=40
	-DGT911_TOUCH_CONFIG_INT_GPIO_NUM=42

	-DUSE_SD_MMC=1
	-D SDM=SD_MMC
	-DPIN_SD_CLK=43
	-DPIN_SD_CMD=44
	-DPIN_SD_D0=39
	-D BOARD_SDMMC_SLOT=0
	-D BOARD_HAS_SDMMC=1
	-D BOARD_SDMMC_POWER_CHANNEL=4

	# See boards/elecrow-esp32p4-7in/platformio.ini for the full explanation.
	# UNVERIFIED here too: not tested against a host.
	-D USB_MSC_HIGH_SPEED=1

lib_deps =
	${env.lib_deps}
	https://github.com/mmMicky/TouchLib
	https://github.com/bmorcelli/Arduino_GFX#ek79007_display

lib_ignore =
	SensorLib
	XPowersLib
